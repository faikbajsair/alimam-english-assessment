    // ================= ROUTING & VIEW CONTROLLER =================
    function navigateTo(page, params = {}) {
      if (typeof ExamAudioManager !== 'undefined' && ExamAudioManager.stop) {
        ExamAudioManager.stop();
      }
      if (typeof SpeakingAudioManager !== 'undefined' && SpeakingAudioManager.stop) {
        SpeakingAudioManager.stop();
      }
      // Route Authentication Guard for protected pages
      if ((page === "admin" || page === "cms") && (!AppState.currentUser || (AppState.currentUser.role !== "admin" && AppState.currentUser.role !== "teacher"))) {
        showToast("Akses Dibatasi: Silakan login terlebih dahulu untuk mengakses Dashboard.");
        page = "landing";
        params.scrollToPortal = true;
      }

      AppState.currentPage = page;
      if (params.code) AppState.activeExamCode = params.code;

      const url = new URL(window.location);
      url.searchParams.set("page", page);
      if (params.code) url.searchParams.set("code", params.code);
      window.history.pushState({}, "", url);

      const root = document.getElementById("appRoot");

      switch(page) {
        case "exam":
          renderExamPlayerView(root);
          break;
        case "admin":
          renderAdminDashboardView(root);
          break;
        case "cms":
          renderCmsAppearanceView(root);
          break;
        case "guide":
          renderOnboardingGuideView(root);
          break;
        case "landing":
        default:
          renderLandingView(root);
          break;
      }

      lucide.createIcons();

      if (window.location.hash === "#portal" || params.scrollToPortal) {
        setTimeout(() => {
          const p = document.getElementById("portal");
          if (p) p.scrollIntoView({ behavior: "smooth", block: "center" });
        }, 120);
      } else {
        window.scrollTo(0, 0);
      }
    }

    function handleGuideDashboardClick() {
      if (AppState.currentUser && (AppState.currentUser.role === "admin" || AppState.currentUser.role === "teacher")) {
        navigateTo("admin");
      } else {
        showToast("Silakan pilih role login atau masukkan akun Admin / Guru terlebih dahulu.");
        scrollToPortal();
      }
    }

    function handleLogout() {
      if (typeof ExamAudioManager !== 'undefined' && ExamAudioManager.stop) ExamAudioManager.stop();
      if (typeof SpeakingAudioManager !== 'undefined' && SpeakingAudioManager.stop) SpeakingAudioManager.stop();
      AppState.currentUser = null;
      sessionStorage.removeItem("alimam_user");
      showToast("Anda telah keluar dari sesi.");
      navigateTo("landing");
    }

    function scrollToPortal() {
      if (AppState.currentPage !== "landing") {
        navigateTo("landing", { scrollToPortal: true });
        return;
      }
      const portal = document.getElementById("portal");
      if (portal) {
        portal.scrollIntoView({ behavior: "smooth", block: "center" });
        const input = document.getElementById("txtUsername");
        if (input) input.focus();
      }
    }

    function handleLoginSubmit(e) {
      e.preventDefault();
      const u = document.getElementById("txtUsername").value.trim();
      const btn = document.getElementById("btnLoginAction");
      btn.disabled = true;
      btn.innerHTML = '<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> Memverifikasi...';
      lucide.createIcons();

      setTimeout(() => {
        if (u === "superadmin" || u === "admincms") {
          AppState.currentUser = { username: u, role: "admin", name: "Administrator Al-Imam" };
          sessionStorage.setItem("alimam_user", JSON.stringify(AppState.currentUser));
          navigateTo("admin");
        } else if (u === "teacher") {
          AppState.currentUser = { username: u, role: "teacher", name: "Ustazah Sarah Jenkins, M.Ed" };
          sessionStorage.setItem("alimam_user", JSON.stringify(AppState.currentUser));
          navigateTo("admin");
        } else {
          AppState.currentUser = { username: u, role: "student", name: "Muhammad Rayhan Al-Fatih" };
          sessionStorage.setItem("alimam_user", JSON.stringify(AppState.currentUser));
          navigateTo("exam", { code: "TOEFL2026" });
        }
      }, 500);
    }

    function handleQuickTokenStart() {
      const token = document.getElementById("landingExamToken").value.trim();

      navigateTo("exam", { code: token });

    let studentMediaRecorder = null;
    let studentAudioChunks = [];

    function toggleSpeakingRecording(qId) {
      const session = AppState.examSession;
      if (!session.isRecording) {
        if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
          navigator.mediaDevices.getUserMedia({ audio: true })
            .then(stream => {
              studentAudioChunks = [];
              studentMediaRecorder = new MediaRecorder(stream);
              studentMediaRecorder.ondataavailable = e => {
                if (e.data && e.data.size > 0) studentAudioChunks.push(e.data);
              };
              studentMediaRecorder.onstop = () => {
                const blob = new Blob(studentAudioChunks, { type: 'audio/webm' });
                const url = URL.createObjectURL(blob);
                session.speakingAudioUrl = url;
                AppState.candidateSpeakingAudioUrl = url;
                session.answers[qId] = "AUDIO_RECORDING_PAYLOAD_VALID";
                renderExamPlayerView(document.getElementById("appRoot"));
                lucide.createIcons();
                showToast("Rekaman suara santri berhasil disimpan!");
              };
              studentMediaRecorder.start();
              session.isRecording = true;
              renderExamPlayerView(document.getElementById("appRoot"));
              lucide.createIcons();
              showToast("Perekaman suara aktif. Silakan berbicara...");
            })
            .catch(err => {
              console.warn("Microphone access unavailable, using simulated recording:", err);
              session.isRecording = true;
              renderExamPlayerView(document.getElementById("appRoot"));
              lucide.createIcons();
              showToast("Simulasi perekaman suara aktif...");
            });
        } else {
          session.isRecording = true;
          renderExamPlayerView(document.getElementById("appRoot"));
          lucide.createIcons();
        }
      } else {
        if (studentMediaRecorder && studentMediaRecorder.state !== 'inactive') {
          studentMediaRecorder.stop();
          session.isRecording = false;
        } else {
          session.isRecording = false;
          session.speakingAudioUrl = "data:audio/mock";
          AppState.candidateSpeakingAudioUrl = "data:audio/mock";
          session.answers[qId] = "AUDIO_RECORDING_PAYLOAD_VALID";
          renderExamPlayerView(document.getElementById("appRoot"));
          lucide.createIcons();
          showToast("Rekaman suara santri berhasil disimpan!");
        }
      }
    }

    // ================= DUAL-ENGINE LISTENING AUDIO MANAGER =================
    const ExamAudioManager = {
      activeQId: null,
      isPlaying: false,
      isSpeech: false,
      html5Audio: null,
      currentSec: 0,
      totalSec: 20,
      progressPercent: 0,
      timerInterval: null,
      speechUtterance: null,

      formatTime(sec) {
        const sInt = Math.max(0, Math.floor(sec || 0));
        const m = Math.floor(sInt / 60).toString().padStart(2, '0');
        const s = (sInt % 60).toString().padStart(2, '0');
        return `${m}:${s}`;
      },

      getQuestionPlayCount(qId) {
        if (!AppState.examSession.audioPlays) {
          AppState.examSession.audioPlays = {};
        }
        return AppState.examSession.audioPlays[qId] || 0;
      },

      incrementPlayCount(qId) {
        if (!AppState.examSession.audioPlays) {
          AppState.examSession.audioPlays = {};
        }
        AppState.examSession.audioPlays[qId] = (AppState.examSession.audioPlays[qId] || 0) + 1;
        this.updatePlayCounterUI(qId);
      },

      updatePlayCounterUI(qId) {
        const badge = document.getElementById("audioPlayCounterBadge");
        if (badge) {
          const count = this.getQuestionPlayCount(qId);
          badge.innerText = `Diputar: ${count} / ${AppState.examSession.maxAudioPlays} kali`;
        }
      },

      updatePlayerUI(playing) {
        this.isPlaying = playing;
        const btnIcon = document.getElementById("btnExamAudioIcon");
        const playStateLabel = document.getElementById("audioPlayStateLabel");
        const visualizer = document.getElementById("audioVisualizerBars");

        if (btnIcon) {
          btnIcon.setAttribute("data-lucide", playing ? "pause" : "play");
          if (!playing) btnIcon.classList.add("ml-0.5");
          else btnIcon.classList.remove("ml-0.5");
          lucide.createIcons();
        }
        if (playStateLabel) {
          playStateLabel.innerText = playing ? "● Sedang Memutar Audio..." : (this.progressPercent >= 99 ? "Audio Selesai" : "Jeda");
          playStateLabel.className = playing ? "text-[10px] font-semibold text-emerald-400 font-sans animate-pulse ml-2 flex-shrink-0" : "text-[10px] font-semibold text-slate-300 font-sans ml-2 flex-shrink-0";
        }
        if (visualizer) {
          if (playing) visualizer.classList.remove("opacity-0");
          else visualizer.classList.add("opacity-0");
        }
      },

      updateProgressUI() {
        const pBar = document.getElementById("examAudioProgressBar");
        const tCur = document.getElementById("audioTimeCurrent");
        const tTot = document.getElementById("audioTimeTotal");
        if (pBar) pBar.style.width = `${this.progressPercent}%`;
        if (tCur) tCur.innerText = this.formatTime(this.currentSec);
        if (tTot) tTot.innerText = this.formatTime(this.totalSec);
      },

      stop() {
        if (this.timerInterval) {
          clearInterval(this.timerInterval);
          this.timerInterval = null;
        }
        if (this.html5Audio) {
          try {
            this.html5Audio.pause();
            this.html5Audio.currentTime = 0;
          } catch(e) {}
          this.html5Audio = null;
        }
        if ('speechSynthesis' in window) {
          try {
            window.speechSynthesis.cancel();
          } catch(e) {}
        }
        this.isPlaying = false;
        this.currentSec = 0;
        this.progressPercent = 0;
        this.updateProgressUI();
        this.updatePlayerUI(false);
      },

      toggle(qId) {
        const q = AppState.questions.find(item => item.id === qId);
        if (!q) return;

        // If currently playing the SAME question, toggle pause
        if (this.activeQId === qId && this.isPlaying) {
          this.pause();
          return;
        }

        // If paused on the same question, resume
        if (this.activeQId === qId && !this.isPlaying && this.currentSec > 0 && this.currentSec < this.totalSec) {
          this.resume(q);
          return;
        }

        // Check play limit (Max 2 times)
        const plays = this.getQuestionPlayCount(qId);
        if (plays >= AppState.examSession.maxAudioPlays) {
          showToast(`Batas maksimal pemutaran (${AppState.examSession.maxAudioPlays}x) untuk soal ini telah tercapai.`);
          return;
        }

        // Fresh playback
        this.stop();
        this.activeQId = qId;
        this.incrementPlayCount(qId);
        this.playQuestion(q);
      },

      pause() {
        if (this.isSpeech) {
          if ('speechSynthesis' in window) {
            window.speechSynthesis.pause();
          }
        } else if (this.html5Audio) {
          this.html5Audio.pause();
        }
        if (this.timerInterval) {
          clearInterval(this.timerInterval);
          this.timerInterval = null;
        }
        this.updatePlayerUI(false);
      },

      resume(q) {
        if (this.isSpeech) {
          if ('speechSynthesis' in window && window.speechSynthesis.paused) {
            window.speechSynthesis.resume();
            this.startTimer();
            this.updatePlayerUI(true);
          } else {
            this.playWithSpeechSynthesis(q);
          }
        } else if (this.html5Audio) {
          this.html5Audio.play().then(() => {
            this.startTimer();
            this.updatePlayerUI(true);
          }).catch(() => {
            this.playWithSpeechSynthesis(q);
          });
        }
      },

      playQuestion(q) {
        // If question has an audio URL, attempt HTML5 playback with auto fallback to TTS
        if (q.audioUrl && typeof q.audioUrl === 'string' && q.audioUrl.trim().length > 5) {
          this.isSpeech = false;
          const audio = new Audio();
          audio.crossOrigin = "anonymous";
          this.html5Audio = audio;

          audio.addEventListener('loadedmetadata', () => {
            if (audio.duration && !isNaN(audio.duration) && isFinite(audio.duration)) {
              this.totalSec = Math.ceil(audio.duration);
              this.updateProgressUI();
            }
          });

          audio.addEventListener('timeupdate', () => {
            if (audio.duration && !isNaN(audio.duration)) {
              this.currentSec = Math.floor(audio.currentTime);
              this.totalSec = Math.ceil(audio.duration);
              this.progressPercent = Math.min(100, (audio.currentTime / audio.duration) * 100);
              this.updateProgressUI();
            }
          });

          audio.addEventListener('ended', () => {
            this.onPlaybackEnded();
          });

          audio.addEventListener('error', (err) => {
            console.warn("HTML5 audio playback failed, falling back to Web Speech Synthesis TTS:", err);
            this.playWithSpeechSynthesis(q);
          });

          audio.src = q.audioUrl;
          const playPromise = audio.play();
          if (playPromise !== undefined) {
            playPromise.then(() => {
              this.updatePlayerUI(true);
              this.startTimer();
              showToast("Memutar audio listening...");
              const badge = document.getElementById("audioEngineBadge");
              if (badge) {
                badge.innerHTML = '<i data-lucide="music" class="w-3 h-3 text-emerald-400"></i> Audio Track';
                lucide.createIcons();
              }
            }).catch(err => {
              console.warn("Audio autoplay blocked or format error, fallback to TTS:", err);
              this.playWithSpeechSynthesis(q);
            });
          }
        } else {
          // Play directly using Speech Synthesis TTS
          this.playWithSpeechSynthesis(q);
        }
      },

      playWithSpeechSynthesis(q) {
        this.isSpeech = true;
        if (this.html5Audio) {
          try { this.html5Audio.pause(); } catch(e){}
          this.html5Audio = null;
        }
        if (!('speechSynthesis' in window)) {
          showToast("Peramban Anda tidak mendukung pemutaran suara otomatis.");
          return;
        }

        window.speechSynthesis.cancel();

        // Extract speech text from passage or prompt
        let textToSpeak = "";
        if (q.passage && q.prompt) {
          textToSpeak = `${q.passage}. \n\n ${q.prompt}`;
        } else if (q.passage) {
          textToSpeak = q.passage;
        } else if (q.prompt) {
          textToSpeak = q.prompt;
        } else {
          textToSpeak = "Listening comprehension assessment question.";
        }

        // Clean formatting symbols
        textToSpeak = textToSpeak.replace(/[\*\#\_]/g, ' ');

        // Estimate duration based on word count (~110 words/min)
        const wordCount = textToSpeak.trim().split(/\s+/).length;
        this.totalSec = Math.max(12, Math.ceil((wordCount / 110) * 60) + 2);
        this.currentSec = 0;
        this.progressPercent = 0;
        this.updateProgressUI();

        const utterance = new SpeechSynthesisUtterance(textToSpeak);
        utterance.lang = "en-US";
        utterance.rate = 0.90; // Natural TOEFL speaking pace
        utterance.pitch = 1.0;

        const voices = window.speechSynthesis.getVoices();
        const englishVoice = voices.find(v => v.lang.startsWith('en') && (v.name.includes('Google') || v.name.includes('Natural') || v.name.includes('Samantha') || v.name.includes('Daniel') || v.name.includes('Karen') || v.name.includes('US') || v.name.includes('UK'))) || voices.find(v => v.lang.startsWith('en'));
        if (englishVoice) utterance.voice = englishVoice;

        utterance.onstart = () => {
          this.updatePlayerUI(true);
          this.startTimer();
          showToast("Memutar narasi audio listening (Native English Voice)...");
          const badge = document.getElementById("audioEngineBadge");
          if (badge) {
            badge.innerHTML = '<i data-lucide="sparkles" class="w-3 h-3 text-amber-400"></i> AI Voice Synthesis';
            lucide.createIcons();
          }
        };

        utterance.onend = () => {
          this.onPlaybackEnded();
        };

        utterance.onerror = (e) => {
          console.warn("TTS Error:", e);
          this.onPlaybackEnded();
        };

        this.speechUtterance = utterance;
        window.speechSynthesis.speak(utterance);
      },

      startTimer() {
        if (this.timerInterval) clearInterval(this.timerInterval);
        const startMs = Date.now() - (this.currentSec * 1000);
        const durationMs = this.totalSec * 1000;

        this.timerInterval = setInterval(() => {
          const elapsed = Date.now() - startMs;
          this.currentSec = Math.min(this.totalSec, Math.floor(elapsed / 1000));
          this.progressPercent = Math.min(100, (elapsed / durationMs) * 100);
          this.updateProgressUI();

          if (this.currentSec >= this.totalSec) {
            clearInterval(this.timerInterval);
            this.timerInterval = null;
          }
        }, 200);
      },

      onPlaybackEnded() {
        if (this.timerInterval) {
          clearInterval(this.timerInterval);
          this.timerInterval = null;
        }
        this.currentSec = this.totalSec;
        this.progressPercent = 100;
        this.updateProgressUI();
        this.updatePlayerUI(false);
        const playStateLabel = document.getElementById("audioPlayStateLabel");
        if (playStateLabel) {
          playStateLabel.innerText = "Audio selesai diputar";
          playStateLabel.className = "text-[10px] font-semibold text-emerald-400 font-sans ml-2 flex-shrink-0";
        }
      }
    };

          audio.addEventListener('timeupdate', () => {
            if (audio.duration && !isNaN(audio.duration)) {
              this.currentSec = Math.floor(audio.currentTime);
              this.totalSec = Math.ceil(audio.duration);
              this.progressPercent = Math.min(100, (audio.currentTime / audio.duration) * 100);

      playSpeechCandidate() {
        this.isSpeech = true;
        if (!('speechSynthesis' in window)) {
          showToast("Peramban tidak mendukung pemutaran suara.");

        window.speechSynthesis.cancel();

        const candidateSpeech = "I would like to speak about an inspiring scholar and mentor whose dedication and wisdom have profoundly shaped my worldview and academic aspirations. He exemplified the timeless values of humility, intellectual rigor, and unwavering commitment to serving the community. Whenever we faced complex challenges, he encouraged us to integrate moral integrity with rigorous knowledge. His guidance instilled in me a deep passion for continuous learning and ethical leadership. His enduring legacy continues to motivate my ambition to contribute meaningfully to society and education.";

        const wordCount = candidateSpeech.trim().split(/\s+/).length;
        this.totalSec = Math.max(15, Math.ceil((wordCount / 105) * 60));
        this.currentSec = 0;
        this.progressPercent = 0;
        this.updateProgressUI();

        const utterance = new SpeechSynthesisUtterance(candidateSpeech);
        utterance.lang = "en-US";
        utterance.rate = 0.95; // Fluent student tempo
        utterance.pitch = 1.05;

        const voices = window.speechSynthesis.getVoices();
        const studentVoice = voices.find(v => v.lang.startsWith('en') && (v.name.includes('Natural') || v.name.includes('Samantha') || v.name.includes('David') || v.name.includes('Alex') || v.name.includes('Guy') || v.name.includes('Google') || v.name.includes('en-US'))) || voices.find(v => v.lang.startsWith('en'));
        if (studentVoice) utterance.voice = studentVoice;

        utterance.onstart = () => {
          this.updatePlayerUI(true);
          this.startTimer();
          showToast("Memutar audio respon speaking kandidat (Muhammad Rayhan Al-Fatih)...");
        };

        utterance.onend = () => {
          this.onPlaybackEnded();
        };

        utterance.onerror = () => {
          this.onPlaybackEnded();
        };

        this.speechUtterance = utterance;
        window.speechSynthesis.speak(utterance);
      },

      startTimer() {
        if (this.timerInterval) clearInterval(this.timerInterval);
        const startMs = Date.now() - (this.currentSec * 1000);
        const durationMs = this.totalSec * 1000;

        this.timerInterval = setInterval(() => {
          const elapsed = Date.now() - startMs;
          this.currentSec = Math.min(this.totalSec, Math.floor(elapsed / 1000));
          this.progressPercent = Math.min(100, (elapsed / durationMs) * 100);
          this.updateProgressUI();

          if (this.currentSec >= this.totalSec) {
            clearInterval(this.timerInterval);
            this.timerInterval = null;
          }
        }, 200);
      },

      onPlaybackEnded() {
        if (this.timerInterval) {
          clearInterval(this.timerInterval);
          this.timerInterval = null;
        }
        this.currentSec = this.totalSec;
        this.progressPercent = 100;
        this.updateProgressUI();
        this.updatePlayerUI(false);
        const statusLabel = document.getElementById("speakingRubricStatusLabel");
        if (statusLabel) {
          statusLabel.innerText = "Audio Selesai Diputar";
          statusLabel.className = "text-[10px] font-semibold text-emerald-400 font-sans ml-2 flex-shrink-0";
        }
      }
    };

    // Question Bank Interactive Handlers
    function openAddQuestionSpaModal(editingId) {
      const modal = document.getElementById("addQuestionSpaModal");
      if (!modal) return;
      
      const form = document.getElementById("spaAddQuestionForm");
      const title = document.getElementById("modalQuestionTitle");
      const editingInput = document.getElementById("modalEditingId");
      
      if (editingId) {
        const q = AppState.questions.find(item => item.id === editingId);
        if (q) {
          title.innerText = "Edit Soal (" + q.id + ")";
          editingInput.value = q.id;
          document.getElementById("modalExamType").value = q.examType || "TOEFL_ITP";
          document.getElementById("modalSection").value = q.section || "listening";
          document.getElementById("modalType").value = q.type || "multiple_choice";
          document.getElementById("modalAudioUrl").value = q.audioUrl || "";
          document.getElementById("modalPassage").value = q.passage || "";
          document.getElementById("modalPrompt").value = q.prompt || "";
          document.getElementById("modalPoints").value = q.points !== undefined ? q.points : 1;
          
          handleSectionTypeChange();

          if (q.options && q.options.length >= 4) {
            document.getElementById("optA").value = q.options[0].text || "";
            document.getElementById("optB").value = q.options[1].text || "";
            document.getElementById("optC").value = q.options[2].text || "";
            document.getElementById("optD").value = q.options[3].text || "";
          } else if (q.options && q.options.length > 0) {
            document.getElementById("optA").value = (q.options[0] && q.options[0].text) || "";
            document.getElementById("optB").value = (q.options[1] && q.options[1].text) || "";
            document.getElementById("optC").value = (q.options[2] && q.options[2].text) || "";
            document.getElementById("optD").value = (q.options[3] && q.options[3].text) || "";
          } else {
            document.getElementById("optA").value = "";
            document.getElementById("optB").value = "";
            document.getElementById("optC").value = "";
            document.getElementById("optD").value = "";
          }
          
          document.getElementById("modalCorrect").value = q.correct || "A";
        }
      } else {
        title.innerText = "Tambah Soal ke Bank Asesmen";
        editingInput.value = "";
        if (form) form.reset();
        document.getElementById("modalPoints").value = 1;
        document.getElementById("optA").value = "";
        document.getElementById("optB").value = "";
        document.getElementById("optC").value = "";
        document.getElementById("optD").value = "";
        handleSectionTypeChange();
      }
      
      modal.classList.remove("hidden");
      lucide.createIcons();
    }

    function closeAddQuestionSpaModal() {
      const modal = document.getElementById("addQuestionSpaModal");
      if (modal) modal.classList.add("hidden");
    }

    function handleSectionTypeChange() {
      const secEl = document.getElementById("modalSection");
      const typeEl = document.getElementById("modalType");
      if (!secEl || !typeEl) return;

      const sec = secEl.value;
      const type = typeEl.value;
      const fieldOptions = document.getElementById("fieldOptions");
      const fieldAudio = document.getElementById("fieldAudioUrl");
      const correctSelect = document.getElementById("modalCorrect");
      const pointsInput = document.getElementById("modalPoints");

      if (sec === "writing" || type === "essay") {
        if (fieldOptions) fieldOptions.classList.add("hidden");
        if (fieldAudio) fieldAudio.classList.add("hidden");
        if (correctSelect) correctSelect.value = "Standard Rubric";
        if (pointsInput && pointsInput.value === "1") pointsInput.value = "100";
      } else if (sec === "speaking" || type === "speaking_record") {
        if (fieldOptions) fieldOptions.classList.add("hidden");
        if (fieldAudio) fieldAudio.classList.remove("hidden");
        if (correctSelect) correctSelect.value = "Examiner Rubric";
        if (pointsInput && pointsInput.value === "1") pointsInput.value = "100";
      } else {
        if (fieldOptions) fieldOptions.classList.remove("hidden");
        if (sec === "listening") {
          if (fieldAudio) fieldAudio.classList.remove("hidden");
        } else {
          if (fieldAudio) fieldAudio.classList.add("hidden");
        }
        if (correctSelect && (correctSelect.value === "Standard Rubric" || correctSelect.value === "Examiner Rubric")) {
          correctSelect.value = "A";
        }
        if (pointsInput && pointsInput.value === "100") pointsInput.value = "1";
      }
    }

    function testModalAudio() {
      const url = document.getElementById("modalAudioUrl").value;
      const promptText = (document.getElementById("modalPrompt").value || "This is a sample audio listening test for English assessment.").replace(/[\*\#\_]/g, ' ');
      if (url && url.trim().length > 5) {
        const audio = new Audio(url);
        audio.play().then(() => {
          showToast("Audio URL berhasil diputar!");
        }).catch(err => {
          showToast("URL audio tidak merespons, memutar simulasi AI Voice Synthesis...");
          if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utt = new SpeechSynthesisUtterance(promptText);
            utt.lang = 'en-US';
            utt.rate = 0.90;
            window.speechSynthesis.speak(utt);
          }
        });
      } else {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          const utt = new SpeechSynthesisUtterance(promptText);
          utt.lang = 'en-US';
          utt.rate = 0.90;
          window.speechSynthesis.speak(utt);
          showToast("Memutar simulasi AI Voice Synthesis...");
        } else {
          showToast("Masukkan URL audio terlebih dahulu.");
        }
      }
    }

    function saveQuestionSpa(e) {
      e.preventDefault();
      const editingId = document.getElementById("modalEditingId").value;
      const examType = document.getElementById("modalExamType").value;
      const section = document.getElementById("modalSection").value;
      const type = document.getElementById("modalType").value;
      const audioUrl = document.getElementById("modalAudioUrl").value;
      const passage = document.getElementById("modalPassage").value;
      const prompt = document.getElementById("modalPrompt").value;
      const correct = document.getElementById("modalCorrect").value;
      const points = parseInt(document.getElementById("modalPoints").value, 10) || 1;

      let options = [];
      if (type === "multiple_choice" || type === "error_identification") {
        options = [
          { key: "A", text: document.getElementById("optA").value || "Pilihan A" },
          { key: "B", text: document.getElementById("optB").value || "Pilihan B" },
          { key: "C", text: document.getElementById("optC").value || "Pilihan C" },
          { key: "D", text: document.getElementById("optD").value || "Pilihan D" }
        ];
      }

      if (editingId) {
        const idx = AppState.questions.findIndex(q => q.id === editingId);
        if (idx !== -1) {
          AppState.questions[idx] = {
            id: editingId,
            examType,
            section,
            type,
            passage,
            prompt,
            audioUrl,
            options,
            correct,
            points
          };
          showToast(`Soal ${editingId} berhasil diperbarui!`);
        }
      } else {
        const secPrefix = section === "listening" ? "LIST" : section === "structure" ? "STRUC" : section === "reading" ? "READ" : section === "writing" ? "WRIT" : "SPK";
        const newId = `Q-${secPrefix}-${Math.floor(100 + Math.random() * 900)}`;
        AppState.questions.unshift({
          id: newId,
          examType,
          section,
          type,
          passage,
          prompt,
          audioUrl,
          options,
          correct,
          points
        });
        showToast(`Soal baru ${newId} berhasil ditambahkan!`);
      }

      closeAddQuestionSpaModal();
      renderAdminQuestionsTable();
    }

        AppState.questions = AppState.questions.filter(q => q.id !== id);
        showToast(`Soal ${id} telah dihapus.`);
        renderAdminQuestionsTable();

    }

    function renderAdminQuestionsTable() {
      const tbody = document.getElementById("spaQuestionTableBody");
      if (!tbody) return;
      
      const filterSec = document.getElementById("spaFilterSection") ? document.getElementById("spaFilterSection").value : "ALL";
      const searchKeyword = document.getElementById("spaSearchQuestion") ? document.getElementById("spaSearchQuestion").value.toLowerCase().trim() : "";

      let items = AppState.questions;
      if (filterSec !== "ALL") {
        items = items.filter(q => q.section === filterSec);
      }
      if (searchKeyword) {
        items = items.filter(q => 
          q.id.toLowerCase().includes(searchKeyword) || 
          (q.prompt && q.prompt.toLowerCase().includes(searchKeyword)) ||
          (q.examType && q.examType.toLowerCase().includes(searchKeyword))
        );
      }

      if (items.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="6" class="p-8 text-center text-slate-400">
              <i data-lucide="help-circle" class="w-8 h-8 mx-auto mb-2 text-slate-300"></i>
              Tidak ada soal yang sesuai dengan filter atau kata kunci.
            </td>
          </tr>
        `;
        lucide.createIcons();
        return;
      }

      tbody.innerHTML = items.map(q => `
        <tr class="hover:bg-slate-50 transition-colors">
          <td class="p-3.5 font-bold font-mono text-slate-800">
            ${q.id}<br><span class="text-[10px] text-brand-700 font-sans font-semibold">${q.examType || 'TOEFL_ITP'}</span>
          </td>
          <td class="p-3.5 uppercase font-bold text-slate-600">${q.section}</td>
          <td class="p-3.5 text-slate-700">${(q.type || 'multiple_choice').replace('_', ' ')}</td>
          <td class="p-3.5 text-slate-700 max-w-xs truncate" title="${q.prompt}">${q.prompt}</td>

    function triggerSpaCsvImport() {
      const fileInput = document.getElementById("spaCsvFileInput");

    }

    function handleSpaCsvImport(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const text = e.target.result;
          if (file.name.endsWith(".json")) {
            const data = JSON.parse(text);
            if (Array.isArray(data)) {
              AppState.questions = [...data, ...AppState.questions];
              showToast(`${data.length} soal berhasil diimpor dari file JSON.`);
            }
          } else {
            const lines = text.split("\n").filter(l => l.trim().length > 0);
            let importedCount = 0;
            const startIndex = lines[0].toLowerCase().includes("prompt") ? 1 : 0;
            for (let i = startIndex; i < lines.length; i++) {
              const parts = lines[i].split(",").map(p => p.replace(/^"|"$/g, '').trim());
              if (parts.length >= 4) {
                AppState.questions.unshift({
                  id: parts[0] || `Q-IMP-${Math.floor(100 + Math.random() * 900)}`,
                  examType: parts[1] || "TOEFL_ITP",
                  section: parts[2] || "structure",
                  type: parts[3] || "multiple_choice",
                  prompt: parts[4] || "Imported Question Prompt",
                  correct: parts[5] || "A",
                  options: [
                    { key: "A", text: "Option A" },
                    { key: "B", text: "Option B" },
                    { key: "C", text: "Option C" },
                    { key: "D", text: "Option D" }
                  ],
                  points: 1
                });
                importedCount++;
              }
            }
            showToast(`${importedCount} soal berhasil diimpor dari CSV.`);
          }
          renderAdminQuestionsTable();
        } catch (err) {
          showToast("Gagal memproses file template: Format tidak valid.");
        }
      };
      reader.readAsText(file);
    }

    function exportSpaQuestionsCsv() {
      let csv = "id,examType,section,type,prompt,correct\n";
      AppState.questions.forEach(q => {
        csv += `"${q.id}","${q.examType}","${q.section}","${q.type}","${q.prompt}","${q.correct}"\n`;
      });
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = "Al_Imam_Question_Bank.csv";
      link.click();
      showToast("File CSV Bank Soal berhasil diunduh.");
    }

    function downloadSpaCertPdf() {
      const el = document.getElementById("spaCertPrintArea");
      const opt = {
        margin: 5,
        filename: 'Al_Imam_Official_Certificate.pdf',
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: { scale: 2 },
        jsPDF: { unit: 'mm', format: 'a4', orientation: 'landscape' }
      };
      html2pdf().set(opt).from(el).save();
      showToast("PDF Sertifikat sedang diunduh...");
    }

    // Global Toast Helper
    function showToast(msg) {
      const toast = document.getElementById("globalToast");
      const text = document.getElementById("globalToastMsg");
      if (!toast || !text) return;
      text.innerText = msg;
      toast.classList.remove("translate-y-20", "opacity-0");
      setTimeout(() => {
        toast.classList.add("translate-y-20", "opacity-0");
      }, 3000);
    }

        } catch(e) {}
      }
      const urlParams = new URLSearchParams(window.location.search);
      const page = urlParams.get("page") || "landing";
      const code = urlParams.get("code") || "TOEFL2026";
      AppState.activeExamCode = code;
