    // ================= ROUTING & VIEW CONTROLLER =================
    function navigateTo(page, params = {}) {
      if (typeof ExamAudioManager !== 'undefined' && ExamAudioManager.stop) {
        ExamAudioManager.stop();
      }
      if (typeof SpeakingAudioManager !== 'undefined' && SpeakingAudioManager.stop) {
        SpeakingAudioManager.stop();
      }
      // Route Authentication Guard for protected pages
      if ((page === "admin" || page === "cms") && (!AppState.currentUser || (AppState.currentUser.role !== "admin" && AppState.currentUser.role !== "teacher"))) {
        showToast("Restricted Access: Please log in to access the Dashboard.");
        page = "landing";
        params.scrollToPortal = true;
      }

      AppState.currentPage = page;
      if (params.code) AppState.activeExamCode = params.code;

      const url = new URL(window.location);
      url.searchParams.set("page", page);
      if (params.code) url.searchParams.set("code", params.code);
      window.history.pushState({}, "", url);

      const root = document.getElementById("appRoot");

      switch(page) {
        case "exam":
          renderExamPlayerView(root);
          break;
        case "admin":
          renderAdminDashboardView(root);
          break;
        case "cms":
          renderCmsAppearanceView(root);
          break;
        case "guide":
          renderOnboardingGuideView(root);
          break;
        case "landing":
        default:
          renderLandingView(root);
          break;
      }

      lucide.createIcons();

      if (window.location.hash === "#portal" || params.scrollToPortal) {
        setTimeout(() => {
          const p = document.getElementById("portal");
          if (p) p.scrollIntoView({ behavior: "smooth", block: "center" });
        }, 120);
      } else {
        window.scrollTo(0, 0);
      }
    }

    function handleGuideDashboardClick() {
      if (AppState.currentUser && (AppState.currentUser.role === "admin" || AppState.currentUser.role === "teacher")) {
        navigateTo("admin");
      } else {
        showToast("Please select a login role or sign in with an Admin / Teacher account.");
        scrollToPortal();
      }
    }

    function handleLogout() {
      if (typeof ExamAudioManager !== 'undefined' && ExamAudioManager.stop) ExamAudioManager.stop();
      if (typeof SpeakingAudioManager !== 'undefined' && SpeakingAudioManager.stop) SpeakingAudioManager.stop();
      AppState.currentUser = null;
      sessionStorage.removeItem("alimam_user");
      showToast("You have been logged out.");
      navigateTo("landing");
    }

    function scrollToPortal() {
      if (AppState.currentPage !== "landing") {
        navigateTo("landing", { scrollToPortal: true });
        return;
      }
      const portal = document.getElementById("portal");
      if (portal) {
        portal.scrollIntoView({ behavior: "smooth", block: "center" });
        const input = document.getElementById("txtUsername");
        if (input) input.focus();
      }
    }

    // Quick Login Helper
    function setCredentials(u, p) {
      document.getElementById("txtUsername").value = u;
      document.getElementById("txtPassword").value = p;
      showToast("Credentials for '" + u + "' auto-filled.");
    }

    function handleLoginSubmit(e) {
      e.preventDefault();
      const u = document.getElementById("txtUsername").value.trim();
      const btn = document.getElementById("btnLoginAction");
      btn.disabled = true;
      btn.innerHTML = '<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> Verifying...';
      lucide.createIcons();

      setTimeout(() => {
        if (u === "superadmin" || u === "admincms") {
          AppState.currentUser = { username: u, role: "admin", name: "Administrator Al-Imam" };
          sessionStorage.setItem("alimam_user", JSON.stringify(AppState.currentUser));
          navigateTo("admin");
        } else if (u === "teacher") {
          AppState.currentUser = { username: u, role: "teacher", name: "Ustazah Sarah Jenkins, M.Ed" };
          sessionStorage.setItem("alimam_user", JSON.stringify(AppState.currentUser));
          navigateTo("admin");
        } else {
          AppState.currentUser = { username: u, role: "student", name: "Muhammad Rayhan Al-Fatih" };
          sessionStorage.setItem("alimam_user", JSON.stringify(AppState.currentUser));
          navigateTo("exam", { code: "TOEFL2026" });
        }
      }, 500);
    }

    function handleQuickTokenStart() {
      const token = document.getElementById("landingExamToken").value.trim();
      if (!token) {
        alert("Please enter an exam token code first.");
        return;
      }
      AppState.activeExamCode = token;
      navigateTo("exam", { code: token });
    }

    function unlockNextHint(qId) {
      if (!AppState.examSession.hintsUnlocked) AppState.examSession.hintsUnlocked = {};
      const currentCount = AppState.examSession.hintsUnlocked[qId] || 0;
      const q = AppState.questions.find(item => item.id === qId);
      const maxHints = (q && q.hints) ? q.hints.length : 0;
      if (currentCount < maxHints) {
        AppState.examSession.hintsUnlocked[qId] = currentCount + 1;
        renderExamPlayerView(document.getElementById("appRoot"));
        lucide.createIcons();
        showToast(`Hint ${currentCount + 1} unlocked successfully!`);
      }
    }

    function handleClozeInput(qId, blankKey, value) {
      if (!AppState.examSession.answers[qId] || typeof AppState.examSession.answers[qId] !== 'object') {
        AppState.examSession.answers[qId] = {};
      }
      AppState.examSession.answers[qId][blankKey] = value.trim();
      
      const currentQ = AppState.questions.find(q => q.id === qId);
      const totalBlanks = currentQ && currentQ.clozeAnswers ? Object.keys(currentQ.clozeAnswers).length : (currentQ && currentQ.passage ? (currentQ.passage.match(/\[\d+\]/g) || []).length : 1);
      const filled = Object.values(AppState.examSession.answers[qId]).filter(v => v && v.toString().trim().length > 0).length;
      
      const badgeEl = document.getElementById(`clozeProgressBadge_${qId}`);
      if (badgeEl) {
        badgeEl.innerText = `${filled} / ${totalBlanks} Filled`;
      }
      const paletteBtn = document.getElementById(`paletteBtn_${qId}`);
      if (paletteBtn) {
        if (filled > 0) {
          paletteBtn.className = "h-9 rounded-xl border text-xs font-mono transition-all flex items-center justify-center bg-brand-600 text-white font-bold border-brand-700";
        }
      }
    }

    function handleEssayInput(qId, el) {
      AppState.examSession.answers[qId] = el.value;
    }

    let studentMediaRecorder = null;
    let studentAudioChunks = [];

    function toggleSpeakingRecording(qId) {
      const session = AppState.examSession;
      if (!session.isRecording) {
        if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
          navigator.mediaDevices.getUserMedia({ audio: true })
            .then(stream => {
              studentAudioChunks = [];
              studentMediaRecorder = new MediaRecorder(stream);
              studentMediaRecorder.ondataavailable = e => {
                if (e.data && e.data.size > 0) studentAudioChunks.push(e.data);
              };
              studentMediaRecorder.onstop = () => {
                const blob = new Blob(studentAudioChunks, { type: 'audio/webm' });
                const url = URL.createObjectURL(blob);
                session.speakingAudioUrl = url;
                AppState.candidateSpeakingAudioUrl = url;
                session.answers[qId] = "AUDIO_RECORDING_PAYLOAD_VALID";
                renderExamPlayerView(document.getElementById("appRoot"));
                lucide.createIcons();
                showToast("Student voice recording saved successfully!");
              };
              studentMediaRecorder.start();
              session.isRecording = true;
              renderExamPlayerView(document.getElementById("appRoot"));
              lucide.createIcons();
              showToast("Recording active. Please speak into your microphone...");
            })
            .catch(err => {
              console.warn("Microphone access unavailable, using simulated recording:", err);
              session.isRecording = true;
              renderExamPlayerView(document.getElementById("appRoot"));
              lucide.createIcons();
              showToast("Voice recording simulation active...");
            });
        } else {
          session.isRecording = true;
          renderExamPlayerView(document.getElementById("appRoot"));
          lucide.createIcons();
        }
      } else {
        if (studentMediaRecorder && studentMediaRecorder.state !== 'inactive') {
          studentMediaRecorder.stop();
          session.isRecording = false;
        } else {
          session.isRecording = false;
          session.speakingAudioUrl = "data:audio/mock";
          AppState.candidateSpeakingAudioUrl = "data:audio/mock";
          session.answers[qId] = "AUDIO_RECORDING_PAYLOAD_VALID";
          renderExamPlayerView(document.getElementById("appRoot"));
          lucide.createIcons();
          showToast("Student voice recording saved successfully!");
        }
      }
    }

    // ================= AUDIO PROCESSING & NORMALIZATION UTILITIES =================
    function normalizeAudioUrl(url) {
      if (!url || typeof url !== 'string') return '';
      let u = url.trim();
      // Google Drive file link: convert to direct streamable uc export link
      const gdMatch = u.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?id=)([a-zA-Z0-9_-]+)/i);
      if (gdMatch && gdMatch[1]) {
        return `https://docs.google.com/uc?export=download&id=${gdMatch[1]}`;
      }
      // Dropbox shared link: convert dl=0 to raw=1
      if (u.includes('dropbox.com')) {
        return u.replace('dl=0', 'raw=1').replace('?dl=1', '?raw=1');
      }
      return u;
    }

    function isSoundCloudUrl(url) {
      if (!url || typeof url !== 'string') return false;
      return /soundcloud\.com|on\.soundcloud\.com/i.test(url.trim());
    }

    function getSoundCloudEmbedUrl(url) {
      const cleanUrl = url.trim();
      return `https://w.soundcloud.com/player/?url=${encodeURIComponent(cleanUrl)}&color=%23059669&auto_play=true&hide_related=true&show_comments=false&show_user=true&show_reposts=false&show_teaser=false`;
    }

    // ================= DUAL-ENGINE LISTENING AUDIO MANAGER =================
    const ExamAudioManager = {
      activeQId: null,
      isPlaying: false,
      isSpeech: false,
      html5Audio: null,
      currentSec: 0,
      totalSec: 20,
      progressPercent: 0,
      timerInterval: null,
      speechUtterance: null,

      formatTime(sec) {
        const sInt = Math.max(0, Math.floor(sec || 0));
        const m = Math.floor(sInt / 60).toString().padStart(2, '0');
        const s = (sInt % 60).toString().padStart(2, '0');
        return `${m}:${s}`;
      },

      getQuestionPlayCount(qId) {
        if (!AppState.examSession.audioPlays) {
          AppState.examSession.audioPlays = {};
        }
        return AppState.examSession.audioPlays[qId] || 0;
      },

      incrementPlayCount(qId) {
        if (!AppState.examSession.audioPlays) {
          AppState.examSession.audioPlays = {};
        }
        AppState.examSession.audioPlays[qId] = (AppState.examSession.audioPlays[qId] || 0) + 1;
        this.updatePlayCounterUI(qId);
      },

      updatePlayCounterUI(qId) {
        const badge = document.getElementById("audioPlayCounterBadge");
        if (badge) {
          const count = this.getQuestionPlayCount(qId);
          badge.innerText = `Plays: ${count} / ${AppState.examSession.maxAudioPlays}`;
        }
      },

      updatePlayerUI(playing) {
        this.isPlaying = playing;
        const btnIcon = document.getElementById("btnExamAudioIcon");
        const playStateLabel = document.getElementById("audioPlayStateLabel");
        const visualizer = document.getElementById("audioVisualizerBars");

        if (btnIcon) {
          btnIcon.setAttribute("data-lucide", playing ? "pause" : "play");
          if (!playing) btnIcon.classList.add("ml-0.5");
          else btnIcon.classList.remove("ml-0.5");
          lucide.createIcons();
        }
        if (playStateLabel) {
          playStateLabel.innerText = playing ? "● Playing Audio Track..." : (this.progressPercent >= 99 ? "Audio Completed" : "Paused");
          playStateLabel.className = playing ? "text-[10px] font-semibold text-emerald-400 font-sans animate-pulse ml-2 flex-shrink-0" : "text-[10px] font-semibold text-slate-300 font-sans ml-2 flex-shrink-0";
        }
        if (visualizer) {
          if (playing) visualizer.classList.remove("opacity-0");
          else visualizer.classList.add("opacity-0");
        }
      },

      updateProgressUI() {
        const pBar = document.getElementById("examAudioProgressBar");
        const tCur = document.getElementById("audioTimeCurrent");
        const tTot = document.getElementById("audioTimeTotal");
        if (pBar) pBar.style.width = `${this.progressPercent}%`;
        if (tCur) tCur.innerText = this.formatTime(this.currentSec);
        if (tTot) tTot.innerText = this.formatTime(this.totalSec);
      },

      stop() {
        if (this.timerInterval) {
          clearInterval(this.timerInterval);
          this.timerInterval = null;
        }
        if (this.html5Audio) {
          try {
            this.html5Audio.pause();
            this.html5Audio.currentTime = 0;
          } catch(e) {}
          this.html5Audio = null;
        }
        if ('speechSynthesis' in window) {
          try {
            window.speechSynthesis.cancel();
          } catch(e) {}
        }
        this.isPlaying = false;
        this.currentSec = 0;
        this.progressPercent = 0;
        this.updateProgressUI();
        this.updatePlayerUI(false);
      },

      toggle(qId) {
        const q = AppState.questions.find(item => item.id === qId);
        if (!q) return;

        // If currently playing the SAME question, toggle pause
        if (this.activeQId === qId && this.isPlaying) {
          this.pause();
          return;
        }

        // If paused on the same question, resume
        if (this.activeQId === qId && !this.isPlaying && this.currentSec > 0 && this.currentSec < this.totalSec) {
          this.resume(q);
          return;
        }

        // Check play limit (Max 2 times)
        const plays = this.getQuestionPlayCount(qId);
        if (plays >= AppState.examSession.maxAudioPlays) {
          showToast(`Playback limit (${AppState.examSession.maxAudioPlays}x) reached for this item.`);
          return;
        }

        // Fresh playback
        this.stop();
        this.activeQId = qId;
        this.incrementPlayCount(qId);
        this.playQuestion(q);
      },

      pause() {
        if (this.isSpeech) {
          if ('speechSynthesis' in window) {
            window.speechSynthesis.pause();
          }
        } else if (this.html5Audio) {
          this.html5Audio.pause();
        }
        if (this.timerInterval) {
          clearInterval(this.timerInterval);
          this.timerInterval = null;
        }
        this.updatePlayerUI(false);
      },

      resume(q) {
        if (this.isSpeech) {
          if ('speechSynthesis' in window && window.speechSynthesis.paused) {
            window.speechSynthesis.resume();
            this.startTimer();
            this.updatePlayerUI(true);
          } else {
            this.playWithSpeechSynthesis(q);
          }
        } else if (this.html5Audio) {
          this.html5Audio.play().then(() => {
            this.startTimer();
            this.updatePlayerUI(true);
          }).catch(() => {
            this.playWithSpeechSynthesis(q);
          });
        }
      },

      playQuestion(q) {
        if (q.audioUrl && isSoundCloudUrl(q.audioUrl)) {
          this.isSpeech = false;
          const container = document.getElementById("examAudioContainer");
          if (container) {
            container.innerHTML = `
              <div class="space-y-2.5">
                <div class="flex items-center justify-between text-xs">
                  <div class="flex items-center gap-2">
                    <span class="font-bold text-emerald-400 flex items-center gap-1.5">
                      <i data-lucide="music" class="w-4 h-4"></i> SoundCloud Listening Track
                    </span>
                    <span class="px-2 py-0.5 rounded-md bg-emerald-900/90 border border-emerald-700/80 text-emerald-300 text-[10px] font-semibold">
                      SoundCloud Stream
                    </span>
                  </div>
                  <span id="audioPlayCounterBadge" class="px-2.5 py-0.5 rounded-full bg-emerald-900/90 border border-emerald-700 text-emerald-200 text-[11px] font-mono">
                    Plays: ${this.getQuestionPlayCount(q.id)} / ${AppState.examSession.maxAudioPlays}
                  </span>
                </div>
                <div class="rounded-xl overflow-hidden shadow-inner bg-slate-900 border border-emerald-800/80">
                  <iframe width="100%" height="120" scrolling="no" frameborder="no" allow="autoplay" src="${getSoundCloudEmbedUrl(q.audioUrl)}"></iframe>
                </div>
                <div class="text-[11px] text-emerald-300/80 italic line-clamp-1">
                  ${q.passage ? q.passage : 'SoundCloud Listening Comprehension'}
                </div>
              </div>
            `;
            lucide.createIcons();
          }
          return;
        }

        const normAudioUrl = normalizeAudioUrl(q.audioUrl);

        // If question has an audio URL, attempt HTML5 playback with auto fallback to TTS
        if (normAudioUrl && normAudioUrl.length > 5) {
          this.isSpeech = false;
          const audio = new Audio();
          audio.crossOrigin = "anonymous";
          this.html5Audio = audio;

          audio.addEventListener('loadedmetadata', () => {
            if (audio.duration && !isNaN(audio.duration) && isFinite(audio.duration)) {
              this.totalSec = Math.ceil(audio.duration);
              this.updateProgressUI();
            }
          });

          audio.addEventListener('timeupdate', () => {
            if (audio.duration && !isNaN(audio.duration)) {
              this.currentSec = Math.floor(audio.currentTime);
              this.totalSec = Math.ceil(audio.duration);
              this.progressPercent = Math.min(100, (audio.currentTime / audio.duration) * 100);
              this.updateProgressUI();
            }
          });

          audio.addEventListener('ended', () => {
            this.onPlaybackEnded();
          });

          audio.addEventListener('error', (err) => {
            console.warn("HTML5 audio playback failed, falling back to Web Speech Synthesis TTS:", err);
            this.playWithSpeechSynthesis(q);
          });

          audio.src = normAudioUrl;
          const playPromise = audio.play();
          if (playPromise !== undefined) {
            playPromise.then(() => {
              this.updatePlayerUI(true);
              this.startTimer();
              showToast("Playing listening audio track (MP3/WAV/OGG/M4A)...");
              const badge = document.getElementById("audioEngineBadge");
              if (badge) {
                badge.innerHTML = '<i data-lucide="music" class="w-3 h-3 text-emerald-400"></i> Audio Track';
                lucide.createIcons();
              }
            }).catch(err => {
              console.warn("Audio autoplay blocked or format error, fallback to TTS:", err);
              this.playWithSpeechSynthesis(q);
            });
          }
        } else {
          // Play directly using Speech Synthesis TTS
          this.playWithSpeechSynthesis(q);
        }
      },

      playWithSpeechSynthesis(q) {
        this.isSpeech = true;
        if (this.html5Audio) {
          try { this.html5Audio.pause(); } catch(e){}
          this.html5Audio = null;
        }
        if (!('speechSynthesis' in window)) {
          showToast("Your browser does not support audio speech synthesis.");
          return;
        }

        window.speechSynthesis.cancel();

        // Extract speech text from passage or prompt
        let textToSpeak = "";
        if (q.passage && q.prompt) {
          textToSpeak = `${q.passage}. \n\n ${q.prompt}`;
        } else if (q.passage) {
          textToSpeak = q.passage;
        } else if (q.prompt) {
          textToSpeak = q.prompt;
        } else {
          textToSpeak = "Listening comprehension assessment question.";
        }

        // Clean formatting symbols
        textToSpeak = textToSpeak.replace(/[\*\#\_]/g, ' ');

        // Estimate duration based on word count (~110 words/min)
        const wordCount = textToSpeak.trim().split(/\s+/).length;
        this.totalSec = Math.max(12, Math.ceil((wordCount / 110) * 60) + 2);
        this.currentSec = 0;
        this.progressPercent = 0;
        this.updateProgressUI();

        const utterance = new SpeechSynthesisUtterance(textToSpeak);
        utterance.lang = "en-US";
        utterance.rate = 0.90; // Natural TOEFL speaking pace
        utterance.pitch = 1.0;

        const voices = window.speechSynthesis.getVoices();
        const englishVoice = voices.find(v => v.lang.startsWith('en') && (v.name.includes('Google') || v.name.includes('Natural') || v.name.includes('Samantha') || v.name.includes('Daniel') || v.name.includes('Karen') || v.name.includes('US') || v.name.includes('UK'))) || voices.find(v => v.lang.startsWith('en'));
        if (englishVoice) utterance.voice = englishVoice;

        utterance.onstart = () => {
          this.updatePlayerUI(true);
          this.startTimer();
          showToast("Playing listening passage (Native English Voice)...");
          const badge = document.getElementById("audioEngineBadge");
          if (badge) {
            badge.innerHTML = '<i data-lucide="sparkles" class="w-3 h-3 text-amber-400"></i> AI Voice Synthesis';
            lucide.createIcons();
          }
        };

        utterance.onend = () => {
          this.onPlaybackEnded();
        };

        utterance.onerror = (e) => {
          console.warn("TTS Error:", e);
          this.onPlaybackEnded();
        };

        this.speechUtterance = utterance;
        window.speechSynthesis.speak(utterance);
      },

      startTimer() {
        if (this.timerInterval) clearInterval(this.timerInterval);
        const startMs = Date.now() - (this.currentSec * 1000);
        const durationMs = this.totalSec * 1000;

        this.timerInterval = setInterval(() => {
          const elapsed = Date.now() - startMs;
          this.currentSec = Math.min(this.totalSec, Math.floor(elapsed / 1000));
          this.progressPercent = Math.min(100, (elapsed / durationMs) * 100);
          this.updateProgressUI();

          if (this.currentSec >= this.totalSec) {
            clearInterval(this.timerInterval);
            this.timerInterval = null;
          }
        }, 200);
      },

      onPlaybackEnded() {
        if (this.timerInterval) {
          clearInterval(this.timerInterval);
          this.timerInterval = null;
        }
        this.currentSec = this.totalSec;
        this.progressPercent = 100;
        this.updateProgressUI();
        this.updatePlayerUI(false);
        const playStateLabel = document.getElementById("audioPlayStateLabel");
        if (playStateLabel) {
          playStateLabel.innerText = "Audio playback completed";
          playStateLabel.className = "text-[10px] font-semibold text-emerald-400 font-sans ml-2 flex-shrink-0";
        }
      }
    };

    function submitSpaExam() {
      if (typeof ExamAudioManager !== 'undefined') ExamAudioManager.stop();
      AppState.examSession.submitted = true;
      
      let listCorrect = 0, listTotal = 0;
      let strucCorrect = 0, strucTotal = 0;
      let readCorrect = 0, readTotal = 0;
      
      AppState.questions.forEach(q => {
        const ans = AppState.examSession.answers[q.id];
        if (q.section === "listening") {
          listTotal += (q.points || 1);
          if (ans === q.correct) listCorrect += (q.points || 1);
        } else if (q.section === "structure") {
          strucTotal += (q.points || 1);
          if (ans === q.correct) strucCorrect += (q.points || 1);
        } else if (q.section === "reading") {
          if (q.type === "cloze_text") {
            const clozeDefs = q.clozeAnswers || {};
            const totalBlanks = Object.keys(clozeDefs).length || 3;
            readTotal += (q.points || totalBlanks);
            let subCorrect = 0;
            if (ans && typeof ans === 'object') {
              Object.entries(clozeDefs).forEach(([bNum, allowed]) => {
                const studentVal = (ans[bNum] || '').toLowerCase().trim();
                const allowedList = Array.isArray(allowed) ? allowed.map(a => a.toLowerCase().trim()) : [allowed.toString().toLowerCase().trim()];
                if (allowedList.includes(studentVal)) {
                  subCorrect++;
                }
              });
            }
            readCorrect += (q.points ? (subCorrect / totalBlanks) * q.points : subCorrect);
          } else {
            readTotal += (q.points || 1);
            if (ans === q.correct) readCorrect += (q.points || 1);
          }
        }
      });

      const listRatio = listTotal > 0 ? (listCorrect / listTotal) : 0.85;
      const strucRatio = strucTotal > 0 ? (strucCorrect / strucTotal) : 0.82;
      const readRatio = readTotal > 0 ? (readCorrect / readTotal) : 0.88;

      const listScaled = Math.round(31 + listRatio * 37);
      const strucScaled = Math.round(31 + strucRatio * 37);
      const readScaled = Math.round(31 + readRatio * 36);
      const totalScaled = Math.round(((listScaled + strucScaled + readScaled) * 10) / 3);

      let cefr = "B2";
      let cefrLabel = "Upper Intermediate";
      if (totalScaled >= 627) { cefr = "C1"; cefrLabel = "Advanced / Proficient"; }
      else if (totalScaled >= 543) { cefr = "B2"; cefrLabel = "Upper Intermediate"; }
      else if (totalScaled >= 460) { cefr = "B1"; cefrLabel = "Intermediate"; }
      else { cefr = "A2"; cefrLabel = "Elementary / Pre-Intermediate"; }

      const elTotal = document.getElementById("spaResultScaledScore");
      if (elTotal) elTotal.innerText = totalScaled;
      const elCefr = document.getElementById("spaResultCefrBadge");
      if (elCefr) elCefr.innerText = "CEFR " + cefr;
      const elCefrLabel = document.getElementById("spaResultCefrLabel");
      if (elCefrLabel) elCefrLabel.innerText = cefrLabel;
      const elList = document.getElementById("spaResultListeningScore");
      if (elList) elList.innerText = `${listScaled} / 68`;
      const elStruc = document.getElementById("spaResultStructureScore");
      if (elStruc) elStruc.innerText = `${strucScaled} / 68`;
      const elRead = document.getElementById("spaResultReadingScore");

    function switchAdminTab(tab) {
      if (typeof SpeakingAudioManager !== 'undefined' && SpeakingAudioManager.stop) {
        SpeakingAudioManager.stop();
      }
      document.getElementById("adminTabTests").classList.add("hidden");
      document.getElementById("adminTabProctor").classList.add("hidden");
      document.getElementById("adminTabGrading").classList.add("hidden");
      document.getElementById("adminTabCert").classList.add("hidden");

      document.querySelectorAll("[id^='btnTab']").forEach(b => {
        b.className = "px-4 py-2.5 rounded-xl bg-white text-slate-600 hover:bg-slate-100 flex items-center gap-2 whitespace-nowrap border border-slate-200";
      });

      if (tab === 'tests') {
        document.getElementById("adminTabTests").classList.remove("hidden");
        document.getElementById("btnTabTests").className = "px-4 py-2.5 rounded-xl bg-brand-600 text-white flex items-center gap-2 shadow-sm whitespace-nowrap";
        renderAdminQuestionsTable();
      } else if (tab === 'proctoring') {
        document.getElementById("adminTabProctor").classList.remove("hidden");
        document.getElementById("btnTabProctor").className = "px-4 py-2.5 rounded-xl bg-brand-600 text-white flex items-center gap-2 shadow-sm whitespace-nowrap";
      } else if (tab === 'grading') {
        document.getElementById("adminTabGrading").classList.remove("hidden");
        document.getElementById("btnTabGrading").className = "px-4 py-2.5 rounded-xl bg-brand-600 text-white flex items-center gap-2 shadow-sm whitespace-nowrap";
      } else if (tab === 'cert') {
        document.getElementById("adminTabCert").classList.remove("hidden");
        document.getElementById("btnTabCert").className = "px-4 py-2.5 rounded-xl bg-brand-600 text-white flex items-center gap-2 shadow-sm whitespace-nowrap";
      }

      lucide.createIcons();
    }

    // Question Bank Interactive Handlers
    function openAddQuestionSpaModal(editingId) {
      const modal = document.getElementById("addQuestionSpaModal");
      if (!modal) return;
      
      const form = document.getElementById("spaAddQuestionForm");
      const title = document.getElementById("modalQuestionTitle");
      const editingInput = document.getElementById("modalEditingId");
      const modalHints = document.getElementById("modalHints");
      const modalClozeAnswers = document.getElementById("modalClozeAnswers");
      
      if (editingId) {
        const q = AppState.questions.find(item => item.id === editingId);
        if (q) {
          if (title) title.innerText = "Edit Question (" + q.id + ")";
          if (editingInput) editingInput.value = q.id;
          const examTypeEl = document.getElementById("modalExamType");
          if (examTypeEl) examTypeEl.value = q.examType || "TOEFL_ITP";
          const secEl = document.getElementById("modalSection");
          if (secEl) secEl.value = q.section || "listening";
          const typeEl = document.getElementById("modalType");
          if (typeEl) typeEl.value = q.type || "multiple_choice";
          const audioUrlEl = document.getElementById("modalAudioUrl");
          if (audioUrlEl) audioUrlEl.value = q.audioUrl || "";
          const imageUrlEl = document.getElementById("modalImageUrl");
          if (imageUrlEl) imageUrlEl.value = q.imageUrl || "";
          const videoUrlEl = document.getElementById("modalVideoUrl");
          if (videoUrlEl) videoUrlEl.value = q.videoUrl || "";
          const passageEl = document.getElementById("modalPassage");
          if (passageEl) passageEl.value = q.passage || "";
          const promptEl = document.getElementById("modalPrompt");
          if (promptEl) promptEl.value = q.prompt || "";
          const pointsEl = document.getElementById("modalPoints");
          if (pointsEl) pointsEl.value = q.points !== undefined ? q.points : 1;
          
          if (modalHints) {
            modalHints.value = (q.hints && Array.isArray(q.hints)) ? q.hints.join('\n') : "";
          }
          if (modalClozeAnswers) {
            if (q.clozeAnswers && Object.keys(q.clozeAnswers).length > 0) {
              modalClozeAnswers.value = Object.entries(q.clozeAnswers).map(([k, v]) => `${k}: ${Array.isArray(v) ? v.join(', ') : v}`).join(' | ');
            } else {
              modalClozeAnswers.value = q.correct || "";
            }
          }

          handleSectionTypeChange();
          updateModalAudioPreview();
          updateModalImagePreview();
          updateModalVideoPreview();

          const optA = document.getElementById("optA");
          const optB = document.getElementById("optB");
          const optC = document.getElementById("optC");
          const optD = document.getElementById("optD");

          const getOptText = (opt) => {
            if (!opt) return "";
            if (typeof opt === "string") return opt;
            return opt.text || "";
          };

          if (q.options && q.options.length > 0) {
            if (optA) optA.value = getOptText(q.options[0]);
            if (optB) optB.value = getOptText(q.options[1]);
            if (optC) optC.value = getOptText(q.options[2]);
            if (optD) optD.value = getOptText(q.options[3]);
          } else {
            if (optA) optA.value = "";
            if (optB) optB.value = "";
            if (optC) optC.value = "";
            if (optD) optD.value = "";
          }
          
          const correctEl = document.getElementById("modalCorrect");
          if (correctEl) correctEl.value = q.correct || "A";
        }
      } else {
        if (title) title.innerText = "Add Question to Assessment Bank";
        if (editingInput) editingInput.value = "";
        if (form) form.reset();
        const examTypeEl = document.getElementById("modalExamType");
        if (examTypeEl) examTypeEl.value = "TOEFL_ITP";
        const secEl = document.getElementById("modalSection");
        if (secEl) secEl.value = "listening";
        const typeEl = document.getElementById("modalType");
        if (typeEl) typeEl.value = "multiple_choice";
        const audioUrlEl = document.getElementById("modalAudioUrl");
        if (audioUrlEl) audioUrlEl.value = "";
        const audioFileEl = document.getElementById("modalAudioFileInput");
        if (audioFileEl) audioFileEl.value = "";
        const imageUrlEl = document.getElementById("modalImageUrl");
        if (imageUrlEl) imageUrlEl.value = "";
        const videoUrlEl = document.getElementById("modalVideoUrl");
        if (videoUrlEl) videoUrlEl.value = "";
        const pointsEl = document.getElementById("modalPoints");
        if (pointsEl) pointsEl.value = 1;
        const optA = document.getElementById("optA");
        const optB = document.getElementById("optB");
        const optC = document.getElementById("optC");
        const optD = document.getElementById("optD");
        if (optA) optA.value = "";
        if (optB) optB.value = "";
        if (optC) optC.value = "";
        if (optD) optD.value = "";
        if (modalHints) modalHints.value = "";
        if (modalClozeAnswers) modalClozeAnswers.value = "";
        const correctEl = document.getElementById("modalCorrect");
        if (correctEl) correctEl.value = "A";
        handleSectionTypeChange();
        updateModalAudioPreview();
        updateModalImagePreview();
        updateModalVideoPreview();
      }
      
      modal.style.display = "flex";
      modal.classList.remove("hidden");
      lucide.createIcons();
    }

        modal.style.display = "none";
        modal.classList.add("hidden");

      stopModalAudio();

    function toggleModalVideoPreview(forceShow) {
      const container = document.getElementById("modalVideoPreviewContainer");
      const frame = document.getElementById("modalVideoPreviewFrame");
      const vUrl = (document.getElementById("modalVideoUrl") ? document.getElementById("modalVideoUrl").value : "").trim();
      if (!container || !frame) return;

      if (!forceShow && !container.classList.contains("hidden")) {
        container.classList.add("hidden");
        frame.innerHTML = "";
        return;
      }

      if (!vUrl) {
        showToast("Please enter a video URL first.");
        container.classList.add("hidden");
        frame.innerHTML = "";
        return;
      }

      const ytMatch = vUrl.match(/(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/i);
      if (ytMatch && ytMatch[1]) {
        frame.innerHTML = `<iframe class="w-full h-full" src="https://www.youtube.com/embed/${ytMatch[1]}?rel=0" frameborder="0" allowfullscreen></iframe>`;
      } else {
        frame.innerHTML = `<video controls playsinline class="w-full h-full object-contain"><source src="${vUrl}">Your browser does not support video.</video>`;
      }
      container.classList.remove("hidden");

    function handleSectionTypeChange() {
      const secEl = document.getElementById("modalSection");
      const typeEl = document.getElementById("modalType");
      if (!secEl || !typeEl) return;

      const sec = secEl.value;
      const type = typeEl.value;
      const fieldOptions = document.getElementById("fieldOptions");
      const fieldAudio = document.getElementById("fieldAudioUrl");
      const fieldHints = document.getElementById("fieldHints");
      const fieldCloze = document.getElementById("fieldClozeAnswers");
      const fieldCorrect = document.getElementById("fieldCorrectContainer");
      const correctSelect = document.getElementById("modalCorrect");
      const pointsInput = document.getElementById("modalPoints");

      if (fieldHints) fieldHints.classList.add("hidden");
      if (fieldCloze) fieldCloze.classList.add("hidden");
      if (fieldCorrect) fieldCorrect.classList.remove("hidden");

      if (sec === "writing" || type === "essay") {
        if (fieldOptions) fieldOptions.classList.add("hidden");
        if (correctSelect) correctSelect.value = "Standard Rubric";
        if (pointsInput && pointsInput.value === "1") pointsInput.value = "100";
      } else if (sec === "speaking" || type === "speaking_record") {
        if (fieldOptions) fieldOptions.classList.add("hidden");
        if (correctSelect) correctSelect.value = "Examiner Rubric";
        if (pointsInput && pointsInput.value === "1") pointsInput.value = "100";
      } else if (type === "sentence_blank") {
        if (fieldOptions) fieldOptions.classList.remove("hidden");
        if (fieldHints) fieldHints.classList.remove("hidden");
        if (correctSelect && (correctSelect.value === "Standard Rubric" || correctSelect.value === "Examiner Rubric")) {
          correctSelect.value = "A";
        }
        if (pointsInput && pointsInput.value === "100") pointsInput.value = "1";
      } else if (type === "cloze_text") {
        if (fieldOptions) fieldOptions.classList.add("hidden");
        if (fieldCloze) fieldCloze.classList.remove("hidden");
        if (fieldCorrect) fieldCorrect.classList.add("hidden");
        if (pointsInput && pointsInput.value === "1") pointsInput.value = "3";
      } else {
        if (fieldOptions) fieldOptions.classList.remove("hidden");
        if (correctSelect && (correctSelect.value === "Standard Rubric" || correctSelect.value === "Examiner Rubric")) {
          correctSelect.value = "A";
        }
        if (pointsInput && (pointsInput.value === "100" || pointsInput.value === "3")) pointsInput.value = "1";
      }
    }

    function testModalAudio() {
      if (activeModalAudio || (('speechSynthesis' in window) && window.speechSynthesis.speaking)) {
        stopModalAudio();
        showToast("Audio playback stopped.");
        return;
      }

      const rawUrl = document.getElementById("modalAudioUrl") ? document.getElementById("modalAudioUrl").value.trim() : "";
      const promptText = (document.getElementById("modalPrompt").value || "This is a sample audio listening test for English assessment.").replace(/[\*\#\_]/g, ' ');

      if (isSoundCloudUrl(rawUrl)) {
        updateModalAudioPreview();
        showToast("Playing SoundCloud stream in widget...");
        return;
      }

      const normUrl = normalizeAudioUrl(rawUrl);

      if (normUrl && normUrl.length > 5) {
        const audio = new Audio();
        audio.crossOrigin = "anonymous";
        activeModalAudio = audio;
        audio.src = normUrl;

        audio.addEventListener('ended', () => {
          stopModalAudio();
        });

        audio.addEventListener('error', (err) => {
          console.warn("Direct audio URL failed, playing AI Speech synthesis simulation:", err);
          activeModalAudio = null;
          showToast("Direct audio unreachable, playing AI Voice Synthesis simulation...");
          if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utt = new SpeechSynthesisUtterance(promptText);
            utt.lang = 'en-US';
            utt.rate = 0.90;
            window.speechSynthesis.speak(utt);
          }
        });

        audio.play().then(() => {
          showToast("Playing audio track (MP3/WAV/OGG/M4A)...");
        }).catch(err => {
          console.warn("Audio play catch, fallback to SpeechSynthesis:", err);
          activeModalAudio = null;
          showToast("Playing AI Voice Synthesis simulation...");
          if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utt = new SpeechSynthesisUtterance(promptText);
            utt.lang = 'en-US';
            utt.rate = 0.90;
            window.speechSynthesis.speak(utt);
          }
        });
      } else {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          const utt = new SpeechSynthesisUtterance(promptText);
          utt.lang = 'en-US';
          utt.rate = 0.90;
          window.speechSynthesis.speak(utt);
          showToast("Playing AI Voice Synthesis simulation (No audio attached)...");
        } else {
          showToast("Please attach an audio file or enter an audio URL.");
        }
      }
    }

    function saveQuestionSpa(e) {
      e.preventDefault();
      const editingId = document.getElementById("modalEditingId").value;
      const examType = document.getElementById("modalExamType").value;
      const section = document.getElementById("modalSection").value;
      const type = document.getElementById("modalType").value;
      const audioUrl = document.getElementById("modalAudioUrl") ? document.getElementById("modalAudioUrl").value.trim() : "";
      const imageUrl = document.getElementById("modalImageUrl") ? document.getElementById("modalImageUrl").value.trim() : "";
      const videoUrl = document.getElementById("modalVideoUrl") ? document.getElementById("modalVideoUrl").value.trim() : "";
      const passage = document.getElementById("modalPassage").value;
      const prompt = document.getElementById("modalPrompt").value;
      let correct = document.getElementById("modalCorrect") ? document.getElementById("modalCorrect").value : "A";
      const points = parseInt(document.getElementById("modalPoints").value, 10) || 1;

      let hints = [];
      const modalHintsEl = document.getElementById("modalHints");
      if (modalHintsEl && modalHintsEl.value.trim().length > 0) {
        hints = modalHintsEl.value.split('\n').map(h => h.trim()).filter(h => h.length > 0);
      }

      let clozeAnswers = {};
      if (type === "cloze_text") {
        const rawCloze = document.getElementById("modalClozeAnswers") ? document.getElementById("modalClozeAnswers").value.trim() : "";
        correct = rawCloze || "Type according to blanks [1], [2]";
        const entries = rawCloze.split(/\||\n/).map(e => e.trim()).filter(e => e.length > 0);
        entries.forEach(item => {
          const parts = item.split(':');
          if (parts.length >= 2) {
            const num = parts[0].trim().replace(/[\[\]]/g, '');
            const answers = parts[1].split(',').map(a => a.trim()).filter(a => a.length > 0);
            clozeAnswers[num] = answers;
          }
        });
      }

      let options = [];
      if (type === "multiple_choice" || type === "error_identification" || type === "sentence_blank") {
        options = [
          { key: "A", text: document.getElementById("optA").value || "Option A" },
          { key: "B", text: document.getElementById("optB").value || "Option B" },
          { key: "C", text: document.getElementById("optC").value || "Option C" },
          { key: "D", text: document.getElementById("optD").value || "Option D" }
        ];
      }

      if (editingId) {
        const idx = AppState.questions.findIndex(q => q.id === editingId);
        if (idx !== -1) {
          AppState.questions[idx] = {
            id: editingId,
            examType,
            section,
            type,
            passage,
            prompt,
            audioUrl,
            imageUrl,
            videoUrl,
            options,
            correct,
            points,
            hints,
            clozeAnswers
          };
          showToast(`Question ${editingId} updated successfully!`);
        }
      } else {
        const secPrefix = section === "listening" ? "LIST" : section === "structure" ? "STRUC" : section === "reading" ? "READ" : section === "writing" ? "WRIT" : "SPK";
        const newId = `Q-${secPrefix}-${Math.floor(100 + Math.random() * 900)}`;
        AppState.questions.unshift({
          id: newId,
          examType,
          section,
          type,
          passage,
          prompt,
          audioUrl,
          imageUrl,
          videoUrl,
          options,
          correct,
          points,
          hints,
          clozeAnswers
        });
        showToast(`New question ${newId} added successfully!`);
      }

      closeAddQuestionSpaModal();
      renderAdminQuestionsTable();
    }

        // 2. Pause and stop all audio elements
        modal.querySelectorAll('audio').forEach(a => {

        });
        // 3. Stop all iframes (YouTube, SoundCloud) by clearing innerHTML or src

    function testPreviewAudio(url, promptText) {
      if (activePreviewAudio || (('speechSynthesis' in window) && window.speechSynthesis.speaking)) {
        stopPreviewMedia();
        return;
      }

      const normUrl = normalizeAudioUrl(url);
      const icon = document.getElementById("btnPreviewAudioIcon");
      const label = document.getElementById("btnPreviewAudioLabel");
      const bar = document.getElementById("previewAudioProgressBar");
      const timeLabel = document.getElementById("previewAudioTime");

      if (normUrl && normUrl.trim().length > 5 && !isSoundCloudUrl(normUrl)) {
        const audio = new Audio();
        audio.crossOrigin = "anonymous";
        activePreviewAudio = audio;
        audio.src = normUrl;

        audio.addEventListener('timeupdate', () => {
          if (audio.duration && !isNaN(audio.duration) && isFinite(audio.duration)) {
            const pct = Math.min(100, (audio.currentTime / audio.duration) * 100);
            if (bar) bar.style.width = pct + "%";
            if (timeLabel) {
              const cur = Math.floor(audio.currentTime);
              const dur = Math.floor(audio.duration);
              const curM = Math.floor(cur / 60).toString().padStart(2, '0') + ':' + (cur % 60).toString().padStart(2, '0');
              const durM = Math.floor(dur / 60).toString().padStart(2, '0') + ':' + (dur % 60).toString().padStart(2, '0');
              timeLabel.innerText = `${curM} / ${durM}`;
            }
          }
        });

        audio.addEventListener('ended', () => {
          stopPreviewMedia();
        });

        audio.addEventListener('error', (err) => {
          console.warn("Direct preview audio failed, falling back to TTS:", err);
          activePreviewAudio = null;
          playPreviewTts(promptText);
        });

        audio.play().then(() => {
          if (icon) icon.setAttribute("data-lucide", "square");
          if (label) label.innerText = "Stop Audio";
          lucide.createIcons();
        }).catch(err => {
          console.warn("Audio play catch fallback to TTS:", err);
          activePreviewAudio = null;
          playPreviewTts(promptText);
        });
      } else {
        playPreviewTts(promptText);
      }
    }

    function playPreviewTts(promptText) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utt = new SpeechSynthesisUtterance(promptText || "Listening audio assessment preview");
      utt.lang = 'en-US';
      utt.rate = 0.90;
      const icon = document.getElementById("btnPreviewAudioIcon");
      const label = document.getElementById("btnPreviewAudioLabel");
      const bar = document.getElementById("previewAudioProgressBar");

      utt.onstart = () => {
        if (icon) icon.setAttribute("data-lucide", "square");
        if (label) label.innerText = "Stop Voice";
        if (bar) bar.style.width = "50%";
        lucide.createIcons();
      };
      utt.onend = () => {
        stopPreviewMedia();
      };
      utt.onerror = () => {
        stopPreviewMedia();
      };
      window.speechSynthesis.speak(utt);
    }

    function handleSpaCsvImport(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const text = e.target.result;
          if (file.name.endsWith(".json")) {
            const data = JSON.parse(text);
            if (Array.isArray(data)) {
              AppState.questions = [...data, ...AppState.questions];
              showToast(`${data.length} questions successfully imported from JSON file.`);
            }
          } else {
            const lines = text.split("\n").filter(l => l.trim().length > 0);
            let importedCount = 0;
            const startIndex = lines[0].toLowerCase().includes("prompt") ? 1 : 0;
            for (let i = startIndex; i < lines.length; i++) {
              const parts = lines[i].split(",").map(p => p.replace(/^"|"$/g, '').trim());
              if (parts.length >= 4) {
                AppState.questions.unshift({
                  id: parts[0] || `Q-IMP-${Math.floor(100 + Math.random() * 900)}`,
                  examType: parts[1] || "TOEFL_ITP",
                  section: parts[2] || "structure",
                  type: parts[3] || "multiple_choice",
                  prompt: parts[4] || "Imported Question Prompt",
                  correct: parts[5] || "A",
                  options: [
                    { key: "A", text: "Option A" },
                    { key: "B", text: "Option B" },
                    { key: "C", text: "Option C" },
                    { key: "D", text: "Option D" }
                  ],
                  points: 1
                });
                importedCount++;
              }
            }
            showToast(`${importedCount} questions successfully imported from CSV.`);
          }
          renderAdminQuestionsTable();
        } catch (err) {
          showToast("Failed to process template file: Invalid format.");
        }
      };
      reader.readAsText(file);
    }

    function exportSpaQuestionsCsv() {
      let csv = "id,examType,section,type,prompt,correct\n";
      AppState.questions.forEach(q => {
        csv += `"${q.id}","${q.examType}","${q.section}","${q.type}","${q.prompt}","${q.correct}"\n`;
      });
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = "Al_Imam_Question_Bank.csv";
      link.click();
      showToast("Question Bank CSV file downloaded successfully.");
    }

          </div>

          <div class="space-y-4">

              <div class="space-y-1">
                <h3 class="text-sm font-bold text-slate-900">Create TOEFL / IELTS Question Bank</h3>
                <p class="text-xs text-slate-600">Choose Listening, Structure, Reading, Writing, or Speaking section. You can attach audio URLs and define essay rubrics.</p>
              </div>

    }

    // Global Toast Helper
    function showToast(msg) {
      const toast = document.getElementById("globalToast");
      const text = document.getElementById("globalToastMsg");
      if (!toast || !text) return;
      text.innerText = msg;
      toast.classList.remove("translate-y-20", "opacity-0");
      setTimeout(() => {
        toast.classList.add("translate-y-20", "opacity-0");
      }, 3000);
    }

    // Initialize SPA on Load
    window.addEventListener("DOMContentLoaded", () => {
      const savedUser = sessionStorage.getItem("alimam_user");
      if (savedUser) {
        try {
          AppState.currentUser = JSON.parse(savedUser);
        } catch(e) {}
      }
      const urlParams = new URLSearchParams(window.location.search);
      const page = urlParams.get("page") || "landing";
      const code = urlParams.get("code") || "TOEFL2026";
      AppState.activeExamCode = code;
      navigateTo(page, { code: code });
    });
  </script>
